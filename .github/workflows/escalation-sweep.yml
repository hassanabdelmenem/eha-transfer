name: Escalation sweep

# Escalates referrals when nobody is signed in: a pending emergency/urgent
# ICU/CCU/PICU referral with no response in 30 minutes (facility level), or a
# pending referral with nowhere to go (system level). The in-app sweep does the
# same every 30 seconds while anyone is signed in; this closes the 3am gap.
# Rules: src/lib/escalationSweep.ts. Script: scripts/escalation-sweep.ts.
#
# Owner decision (30 Sep 2026): a GitHub Actions timer instead of the Blaze
# plan's scheduled Cloud Function. Known limits of GitHub timers:
# - runs can start late under load (often minutes, sometimes more);
# - GitHub disables scheduled workflows after 60 days with no repository
#   activity; re-enable from the Actions tab if that happens.
#
# Credentials are keyless (Workload Identity Federation): GitHub's OIDC token for
# this repository's main branch is exchanged for the escalation-sweep service
# account, which holds roles/datastore.user only. No key exists to leak (the
# project also forbids service-account keys by organisation policy).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only; write nothing'
        type: boolean
        default: false

# Never two sweeps at once; a late run simply waits for the previous one.
concurrency:
  group: escalation-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT: eha-transfer-1785622025
      # Notification text formats times with the runner's clock; make it local.
      TZ: Africa/Cairo

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Authenticate (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/467744756760/locations/global/workloadIdentityPools/github/providers/eha-transfer
          service_account: escalation-sweep@eha-transfer-1785622025.iam.gserviceaccount.com

      - name: Run the sweep
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npx tsx scripts/escalation-sweep.ts $DRY_RUN
