name: CI

on:
  # Every branch, not just the long-lived ones: feature branches (claude/**,
  # refactor/**, ...) previously got no checks at all, so breakage was only
  # discovered after opening a PR.
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch: {}

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Guard: disallow emulators flag on main branch
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$VITE_USE_FIREBASE_EMULATORS" = "true" ]; then
            echo "VITE_USE_FIREBASE_EMULATORS=true is not allowed on main branch" >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (type check)
        run: npm run lint

      - name: Run Unit & Component Tests (Vitest)
        run: npm run test

      # Guards the only server-side authorization layer this app has. Runs
      # against the Firestore emulator, which needs a JVM.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Firestore Security Rules Tests
        run: npm run test:rules

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
