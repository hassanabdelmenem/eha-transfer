name: CI

on:
  # Every branch, not just the long-lived ones: feature branches (claude/**,
  # refactor/**, ...) previously got no checks at all, so breakage was only
  # discovered after opening a PR.
  # A PR shows the push run for its head commit, so there is no pull_request
  # trigger: with both, every PR commit ran the whole suite twice (the two runs
  # have different refs, so the concurrency group below never collapsed them).
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The name must stay quoted: an unquoted YAML scalar containing ": "
      # parses as a nested mapping key and makes this whole file invalid, which
      # GitHub reports as an instant run failure with no jobs rather than as a
      # syntax error. That is what happened between 04 Aug and this commit.
      - name: "Guard: disallow emulators flag on main branch"
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$VITE_USE_FIREBASE_EMULATORS" = "true" ]; then
            echo "VITE_USE_FIREBASE_EMULATORS=true is not allowed on main branch" >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (type check)
        run: npm run lint

      - name: Run Unit & Component Tests (Vitest)
        run: npm run test

      # Guards the only server-side authorization layer this app has. Runs
      # against the Firestore emulator, which needs a JVM.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Firestore Security Rules Tests
        run: npm run test:rules

      # Chromium only: playwright.config.ts has a single chromium project. With
      # no browser named, this installed Firefox and WebKit too, plus 181 apt
      # packages (130 MB, mostly GTK4/GStreamer for those two) (#48, #52).
      #
      # Even for Chromium alone, `--with-deps` still ran apt on every run, and when
      # the Azure Ubuntu mirror is slow that alone blew the 6-minute limit (twice on
      # 6 Oct). The runner image already has every library Chromium needs; apt only
      # added optional CJK/Thai fonts. So: the browser comes from a cache (or
      # Playwright's CDN), a real launch proves it runs, and apt is only a fallback,
      # retried, for an image that one day lacks something.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "Chromium launches; no system packages needed."
            exit 0
          fi
          echo "Chromium did not launch; installing its system packages."
          for attempt in 1 2 3; do
            if timeout 150 npx playwright install-deps chromium; then exit 0; fi
            echo "install-deps attempt $attempt failed or timed out"
          done
          exit 1

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e

      # Playwright above never sees firebase.json's CSP -- it runs against
      # `npm run dev` (Vite), which doesn't apply hosting.headers. This step
      # builds the real bundle and serves it through the Firebase Hosting
      # emulator so we check the CSP actually served, not just declared. See
      # "The CSP in firebase.json and Google sign-in" in docs/DEPLOYMENT.md.
      - name: Verify CSP headers served by Firebase Hosting
        run: npm run test:csp-headers

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
